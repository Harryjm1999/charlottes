# Xcode project definition for the Charlotte's iOS app.
# Generated on GitHub's Macs with XcodeGen (see .github/workflows).
name: Charlottes
options:
  bundleIdPrefix: uk.co.inexcess
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  Charlottes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Charlottes
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        # Test ID: keep uk.co.inexcess.charlottes free for In-Excess's own account.
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.inexcess.charlottes.test
        PRODUCT_NAME: Charlottes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Charlottes/Info.plist
      properties:
        CFBundleDisplayName: Charlotte's
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-SemiBold.ttf
          - Karla-Regular.ttf
          - Karla-Medium.ttf
          - Karla-SemiBold.ttf
